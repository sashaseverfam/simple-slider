<div
  class="img-wrapper"
  [class.img-wrapper--disabled]="isDisabled"
  [style.border-width.px]="borderWidth"
  [style.padding.px]="cardPadding"
  [style.border-color]="borderColor"
  (click)="changeModel.emit()"
>
  @if (photoLink) {
    <img
      class="img-photo"
      [alt]="photoAlt"
      [ngSrc]="photoLink"
      [width]="cardWidth - 2*cardPadding - 2*borderWidth"
      [height]="cardHeight - 2*cardPadding - 2*borderWidth"
    />
  }
</div>
